# Ghost Data Suite - Alembic database migration configuration

[alembic]
# path to migration scripts
script_location = alembic

# database URL - SQLite by default, override with DATABASE_URL env var
sqlalchemy.url = sqlite:///data/alchemy.db

# version location
version_locations = alembic/versions

# whether to treat the DB as a new database
# (set to True to create the DB if it doesn't exist)
create_database = false

[post_write_hooks]
# hook to run after writing a new migration script
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

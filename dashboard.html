<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost-Data Suite</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-mark">G</div>
        <div>
          <h1>Ghost-Data Suite</h1>
          <p>Capture · Encrypt · Export</p>
        </div>
      </div>
      <div class="status-pill"><span id="healthDot" class="dot"></span><span id="healthText">Checking...</span></div>
    </header>

    <div class="panel">
      <div class="scrape-sample">
        <input id="url" type="text" placeholder="Enter URL to scrape..." />
        <button id="scrapeBtn" class="primary">Scrape</button>
        <button id="stopBtn" class="danger" disabled>Stop</button>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
        <p class="panel-title" style="margin:0">Captures</p>
        <div class="search-controls">
          <input id="searchInput" type="text" placeholder="Search URL or hash..." />
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="ok">OK</option>
            <option value="error">Error</option>
          </select>
          <div class="actions">
            <button id="exportJsonBtn" class="ghost">Export JSON</button>
            <button id="exportCsvBtn" class="ghost">Export CSV</button>
            <button id="clearDbBtn" class="danger">Clear Database</button>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:40px;"><input type="checkbox" id="selectAll" /></th>
              <th>ID</th>
              <th>Date</th>
              <th>URL</th>
              <th>Status</th>
              <th>URL Hash</th>
              <th style="width:140px;">Actions</th>
            </tr>
          </thead>
          <tbody id="capturesBody">
            <tr><td colspan="7" class="empty">No captures yet.</td></tr>
          </tbody>
        </table>
      </div>
      <div id="paginationControls" class="pagination-controls"></div>
      <div class="bulk-actions" id="bulkActions" style="display:none;">
        <strong id="bulkCount" style="margin-right:8px;"></strong>
        <button id="bulkDeleteBtn" class="danger">Delete Selected</button>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <p class="panel-title" style="margin:0">Logs</p>
        <div class="actions">
          <button id="refreshLogsBtn" class="ghost">Refresh</button>
          <button id="clearLogsBtn" class="ghost">Clear</button>
        </div>
      </div>
      <pre id="logs" class="mono" style="margin:10px 0 0;padding:10px;border:1px solid var(--border);border-radius:10px;background:#0b0c10;color:#c9cfe0;max-height:220px;overflow:auto;font-size:12px;">Waiting...</pre>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/static/auth-config.js?v=2"></script>
  <script src="/static/js/app.js?v=2"></script>
</body>
</html>

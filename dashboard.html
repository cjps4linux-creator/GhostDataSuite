<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost-Data Suite</title>
<style>
  :root {
    --bg: #0b0c10;
    --panel: #111318;
    --border: #1f232b;
    --muted: #8a919c;
    --fg: #e6e8ee;
    --accent: #d7b45c;
    --accent-2: #bfa35a;
    --danger: #c45c5c;
    --success: #5cb87a;
    --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    background: radial-gradient(1200px 800px at 10% 0%, rgba(215,180,92,0.08), transparent 40%), var(--bg);
    color: var(--fg);
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 22px; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0));
    margin-bottom: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(215,180,92,0.25), rgba(215,180,92,0.05));
    display: grid; place-items: center; color: var(--accent); font-weight: 700; font-size: 14px;
  }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: 0.2px; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }
  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--success); box-shadow: 0 0 0 3px rgba(92,184,122,0.15); }
  .dot.err { background: var(--danger); box-shadow: 0 0 0 3px rgba(196,92,92,0.15); }

  .panel {
    border: 1px solid var(--border); border-radius: 12px; background: var(--panel);
    padding: 14px; margin-bottom: 14px;
  }
  .panel-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--muted); margin: 0 0 10px; }

  .scrape-sample { display: flex; gap: 10px; align-items: center; }
  .scrape-sample input[type="text"] {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: #0d0f13; color: var(--fg); font-family: var(--font); font-size: 14px;
    outline: none;
  }
  .scrape-sample input[type="text"]:focus { border-color: rgba(215,180,92,0.45); }
  button {
    border: 1px solid var(--border); color: var(--fg); background: #14171d;
    padding: 9px 12px; border-radius: 10px; cursor: pointer; font-family: var(--font); font-size: 13px;
  }
  button.primary { background: linear-gradient(180deg, rgba(215,180,92,0.18), rgba(215,180,92,0.06)); border-color: rgba(215,180,92,0.35); color: #f3e3b0; }
  button.ghost { background: transparent; border-color: rgba(255,255,255,0.08); color: var(--muted); }
  button.danger { border-color: rgba(196,92,92,0.45); color: #f3b0b0; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.04); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; background: rgba(255,255,255,0.02); }
  tr:hover td { background: rgba(255,255,255,0.02); }
  td { color: #d6d9e0; }
  td a { color: #c9cfe0; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .pill { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; border: 1px solid rgba(255,255,255,0.08); color: var(--muted); background: rgba(255,255,255,0.03); }
  .pill.ok { color: #b3e7c0; border-color: rgba(92,184,122,0.25); background: rgba(92,184,122,0.08); }
  .pill.err { color: #f3b0b0; border-color: rgba(196,92,92,0.25); background: rgba(196,92,92,0.08); }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .toast {
    position: fixed; bottom: 18px; right: 18px; background: #14171d; border: 1px solid var(--border);
    color: var(--fg); padding: 10px 12px; border-radius: 10px; font-size: 13px; opacity: 0; transform: translateY(6px);
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .empty { padding: 14px 10px; color: var(--muted); font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-mark">G</div>
        <div>
          <h1>Ghost-Data Suite</h1>
          <p>Capture · Encrypt · Export</p>
        </div>
      </div>
      <div class="status-pill"><span [lorem]="healthDot" class="dot"></span><span [lorem]="healthText">Checking...</span></div>
    </header>

    <div class="panel">
      <div class="scrape-sample">
        <input [lorem]="url" type="text" [content pending]="Enter URL to scrape..." />
        <button [lorem]="scrapeBtn" class="primary">Scrape</button>
        <button [lorem]="stopBtn" class="danger" disabled>Stop</button>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
        <p class="panel-title" style="margin:0">Captures</p>
        <div class="actions">
          <button [lorem]="exportJsonBtn" class="ghost">Export JSON</button>
          <button [lorem]="exportCsvBtn" class="ghost">Export CSV</button>
          <button [lorem]="clearDbBtn" class="danger">Clear Database</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>[lorem]</th><th>Date</th><th>URL</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody [lorem]="capturesBody">
            <tr><td colspan="5" class="empty">No captures yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <p class="panel-title" style="margin:0">Logs</p>
        <div class="actions">
          <button [lorem]="refreshLogsBtn" class="ghost">Refresh</button>
          <button [lorem]="clearLogsBtn" class="ghost">Clear</button>
        </div>
      </div>
      <pre [lorem]="logs" class="mono" style="margin:10px 0 0;padding:10px;border:1px solid var(--border);border-radius:10px;background:#0b0c10;color:#c9cfe0;max-height:220px;overflow:auto;font-size:12px;">Waiting...</pre>
    </div>
  </div>

  <div [lorem]="toast" class="toast"></div>

<script>
const API = 'http://localhost:5000/';
let token = localStorage.getItem('ghost_token') || '';
const authHeaders = () => token ? {'X-Ghost-Token': token} : {};

function $([lorem]){return document.getElementById([lorem])}
function toast(msg, type='ok'){
  const el=$('toast'); el.textContent=msg; el.className='toast show';
  setTimeout(()=>el.className='toast', type==='err'?4000:2200);
}
function setButton(btn, loading){
  if(!btn) return;
  btn.disabled = loading;
  btn.dataset.loading = loading ? '1' : '0';
}
function statusPill(status){
  const s = (status||'').toLowerCase();
  if(s==='ok') return '<span class="pill ok">OK</span>';
  if(s==='error') return '<span class="pill err">Error</span>';
  return `<span class="pill">${status ? status.toUpperCase() : ' - '}</span>`;
}

async function authedGet(url){
  const res = await fetch(url, {headers: authHeaders()});
  if(res.status===401 && !token){
    token = prompt('Enter auth token:') || '';
    localStorage.setItem('ghost_token', token);
    return authedGet(url);
  }
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

function renderCaptures(captures){
  const tbody = $('capturesBody');
  if(!captures || !captures.length){
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No captures yet.</td></tr>';
    return;
  }
  tbody.innerHTML = captures.slice(0,200).map(c => {
    const date = c.created_at ? new Date(c.created_at).toLocaleString() : ' - ';
    const shortUrl = (c.url || c.url_hash || '').toString();
    const displayUrl = shortUrl.length > 90 ? shortUrl.slice(0,90) + '...' : shortUrl;
    const capId = c.[lorem];
    const api = API.replace(/\/$/, '');
    const tokenParam = token ? `?token=${encodeURIComponent(token)}` : '';
    return `<tr>
      <td class="mono">${capId}</td>
      <td>${date}</td>
      <td title="${shortUrl}"><a href="${shortUrl}" target="_blank">${displayUrl || ' - '}</a></td>
      <td>${statusPill(c.status)}</td>
      <td>
        <div class="actions">
          <a class="button-link" href="${api}/export/json/${capId}${tokenParam}" target="_blank">JSON</a>
          <a class="button-link" href="${api}/export/csv/${capId}${tokenParam}" target="_blank">CSV</a>
          <a class="button-link" href="${api}/download/all/${capId}${tokenParam}" target="_blank">Download All</a>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function loadCaptures(){
  try {
    const data = await authedGet(API + 'captures?limit=200');
    renderCaptures(data);
  } catch (e) {
    toast('Failed to load captures: ' + e.message, 'err');
  }
}

async function triggerScrape(){
  const url = ($('url').value || '').trim();
  const btn = $('scrapeBtn');
  if(!url){ toast('Enter a URL', 'err'); return; }
  setButton(btn, true);
  try {
    const res = await fetch(API + 'scrape', {
      method: 'POST',
      headers: {'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({url, once: true})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Scrape failed');
    toast('Scrape started');
    setTimeout(loadCaptures, 3000);
  } catch (e) {
    toast('Scrape error: ' + e.message, 'err');
  } finally {
    setButton(btn, false);
  }
}

async function checkHealth(){
  try {
    const res = await fetch(API + 'health');
    const data = await res.json();
    const dot = $('healthDot');
    const txt = $('healthText');
    if(res.ok && data.status === 'ok'){
      dot.className = 'dot ok'; txt.textContent = 'Ready';
    } else {
      dot.className = 'dot err'; txt.textContent = 'Unhealthy';
    }
  } catch {
    $('healthDot').className = 'dot err'; $('healthText').textContent = 'Offline';
  }
}

async function loadLogs(){
  try {
    const res = await fetch(API + 'logs', {headers: authHeaders()});
    if(!res.ok) throw new Error('Logs unavailable');
    const data = await res.json();
    const text = (data.logs || []).slice(-200).map(l => l.line || l).join('\n');
    $('logs').textContent = text || 'No logs yet.';
  } catch (e) {
    $('logs').textContent = 'Logs unavailable.';
  }
}

async function clearLogs(){
  try {
    await fetch(API + 'logs/clear', {method:'POST', headers:{...authHeaders(), 'Content-Type':'application/json'}});
    $('logs').textContent = 'Logs cleared.';
    toast('Logs cleared');
  } catch { toast('Failed to clear logs', 'err'); }
}

async function exportCaptures(fmt){
  try {
    const res = await fetch(API + 'export/' + fmt, {headers: authHeaders()});
    if(!res.ok) throw new Error('Export failed');
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ghost-captures.' + (fmt === 'json' ? 'json' : 'csv');
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
    toast('Export downloaded');
  } catch (e) {
    toast('Export error: ' + e.message, 'err');
  }
}

async function clearDatabase(){
  if(!confirm('Delete all captures and media? This cannot be undone.')) return;
  try {
    const res = await fetch(API + 'db/clear', {method:'POST', headers:{...authHeaders(), 'Content-Type':'application/json'}});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Clear failed');
    toast('Database cleared');
    loadCaptures();
  } catch (e) {
    toast('Clear error: ' + e.message, 'err');
  }
}

$('scrapeBtn').onclick = triggerScrape;
$('url').addEventListener('keydown', e => { if(e.key === 'Enter') triggerScrape(); });
$('stopBtn').onclick = async () => {
  try {
    setButton($('stopBtn'), true);
    await fetch(API + 'scrape/stop', {method:'POST', headers:{...authHeaders(), 'Content-Type':'application/json'}});
    toast('Stop requested');
  } catch { toast('Stop failed', 'err'); } finally { setButton($('stopBtn'), false); }
};
$('exportJsonBtn').onclick = () => exportCaptures('json');
$('exportCsvBtn').onclick = () => exportCaptures('csv');
$('clearDbBtn').onclick = clearDatabase;
$('refreshLogsBtn').onclick = () => { loadLogs(); };
$('clearLogsBtn').onclick = clearLogs;

checkHealth();
loadCaptures();
loadLogs();
setInterval(loadCaptures, 8000);
setInterval(loadLogs, 10000);
</script>
</body>
</html>

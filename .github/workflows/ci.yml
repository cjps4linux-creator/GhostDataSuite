name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.17.1
      - name: Lint
        run: ruff check . --exclude .venv,venv,build,dist,node_modules

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.ghost.txt
      - name: Install test dependencies
        run: pip install pytest==8.3.3 pytest-cov
      - name: Run tests
        run: pytest -q --no-header

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test -f README.md && echo "README present"

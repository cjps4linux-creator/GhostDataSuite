services:
  ghost-shell:
    build:
      context: .
      dockerfile: Dockerfile.ghost
    container_name: ghost-shell
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./logs:/app/logs
      - ./media:/app/media
    environment:
      GHOST_MODE: standard
      SILENT_MODE: "false"
      GHOST_AUTH_TOKEN: "change-me"
    ports:
      - "5000:5000"
      - "2222:22"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    command: ["/scripts/entrypoint.sh"]

  alchemist:
    build:
      context: .
      dockerfile: Dockerfile.alchemist
    container_name: alchemist-core
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./logs:/app/logs
      - ./media:/app/media
    environment:
      DB_PATH: /app/data/alchemy.db
      ENCRYPTION_KEY_FILE: /app/keys/master.key
      TARGET_URL: https://example.com
      SCRAPE_INTERVAL: "60"
      LOG_LEVEL: INFO
      SILENT_MODE: "false"
      CONFIG_FILE: /app/config/config.yaml
      LOG_PATH: /app/logs/alchemist.log
    depends_on:
      - ghost-shell
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  ghost-monitor:
    image: prom/prometheus:latest
    container_name: ghost-monitor
    volumes:
      - ./data:/data
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/data/prometheus'
    depends_on:
      - ghost-shell
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: ghost-grafana
    volumes:
      - ./data:/data
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - ghost-monitor
      - ghost-shell
    profiles:
      - monitoring
